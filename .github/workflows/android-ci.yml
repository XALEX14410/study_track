name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Instalar Android SDK 36
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compilar proyecto
        run: ./gradlew build

      - name: Ejecutar pruebas
        run: ./gradlew test

      - name: Generar APK Debug
        run: ./gradlew assembleDebug

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studytrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
